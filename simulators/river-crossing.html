<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강 건너기 탐색 순서 클릭 연습</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
    @font-face {
        font-family: 'KIMM';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2212@1.0/KIMM_Bold.woff2') format('woff2');
        font-weight: 700;
        font-display: swap;
    }
    @font-face {
        font-family: 'A2z';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/%EC%97%90%EC%9D%B4%ED%88%AC%EC%A7%80%EC%B2%B4-4Regular.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
    }
    @font-face {
        font-family: 'A2z';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/%EC%97%90%EC%9D%B4%ED%88%AC%EC%A7%80%EC%B2%B4-7Bold.woff2') format('woff2');
        font-weight: 700;
        font-display: swap;
    }
    :root {
        --white: #FFFFFF;
        --blue: #1C60EF;
        --blue-light: #DBE8FE;
        --text: #16223f;
        --text-muted: #55647f;
        --red: #ef4444;
        --red-light: #fee2e2;
        --gold: #d4a017;
        --gold-light: #fef3c7;
        --font-title: 'KIMM', 'Malgun Gothic', sans-serif;
        --font-body: 'A2z', 'Malgun Gothic', sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0;
        height: 100%;
        font-family: var(--font-body);
        color: var(--text);
        background: var(--white);
        overflow: hidden;
        user-select: none;
    }
    .app { display: flex; flex-direction: column; height: 100%; }

    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding: 12px 18px;
        border-bottom: 1px solid var(--blue-light);
        background: #fbfcff;
        flex-shrink: 0;
    }
    .topbar h1 { font-family: var(--font-title); font-weight: 700; font-size: 15px; margin: 0; color: var(--text); }
    .topbar .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
    .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .legend .tag { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
    .tag-init { background: #e2e8f0; color: #475569; }
    .tag-forbid { background: var(--red-light); color: #b91c1c; }
    .tag-goal { background: var(--gold-light); color: #92700c; }

    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    button.action {
        font-family: var(--font-body); font-weight: 700; font-size: 12.5px;
        border-radius: 8px; padding: 8px 14px; border: 1px solid var(--blue-light);
        background: var(--white); color: var(--blue); cursor: pointer;
    }
    button.action:hover { background: var(--blue-light); }
    button.action.primary { background: var(--blue); color: var(--white); border-color: var(--blue); }
    button.action.primary:hover { background: #164fce; }

    .status-banner {
        display: none; padding: 9px 18px; font-size: 13px; font-weight: 700; text-align: center; flex-shrink: 0;
    }
    .status-banner.show { display: block; }
    .status-banner.ok { background: var(--gold-light); color: #92700c; }
    .status-banner.bad { background: var(--red-light); color: #b91c1c; }

    .canvas-outer {
        flex: 1; overflow: auto; position: relative;
        background: radial-gradient(circle at 1px 1px, rgba(28,96,239,0.10) 1px, transparent 0) 0 0 / 22px 22px, var(--white);
    }
    .canvas-scaler { position: relative; }
    .canvas-inner { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
    .canvas-inner svg { position: absolute; top: 0; left: 0; pointer-events: none; }

    .rnode {
        position: absolute;
        width: 150px;
        border-radius: 12px;
        border: 2.5px solid var(--blue-light);
        background: var(--white);
        box-shadow: 0 3px 8px rgba(28,96,239,0.10);
        padding: 8px 10px;
        cursor: pointer;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .rnode:hover { border-color: var(--blue); }
    .rnode.goal { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-light); }
    .rnode.visited-seq:not(.goal) { background: var(--blue); border-color: var(--blue); }
    .rnode.visited-seq:not(.goal) .rc-action { color: #fff !important; }
    .rnode.visited-seq { box-shadow: 0 0 0 3px rgba(28,96,239,0.35); }

    .rc-badge {
        position: absolute; top: -10px; left: 8px; font-size: 10px; font-weight: 700;
        padding: 2px 8px; border-radius: 999px; white-space: nowrap; z-index: 3;
    }
    .rc-action { font-size: 13px; font-weight: 700; color: var(--text); text-align: center; padding: 8px 2px; line-height: 1.4; white-space: nowrap; }
    .rc-action.muted { font-size: 11px; font-weight: 400; color: var(--text-muted); }
    .rc-forbid-text { display: none; font-size: 12px; font-weight: 700; color: #92700c; text-align: center; padding: 2px 0 6px; }
    .rnode.goal .rc-forbid-text { display: block; }
    .rc-forbid-text .sub { display: block; font-size: 10.5px; font-weight: 400; color: #92700c; margin-top: 2px; }

    .order-badge {
        position: absolute; top: -10px; right: -8px; background: var(--text); color: var(--white);
        font-size: 10px; font-weight: 700; border-radius: 999px; min-width: 18px; height: 18px;
        display: flex; align-items: center; justify-content: center; padding: 0 4px; z-index: 4;
    }

    .canvas-footer {
        flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
        gap: 14px; flex-wrap: wrap; border-top: 1px solid var(--blue-light); background: #fbfcff;
        padding: 9px 16px;
    }
    .hint {
        font-size: 11.5px; color: var(--text-muted); background: var(--white);
        border: 1px solid var(--blue-light); padding: 4px 12px; border-radius: 999px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    }
    .zoom-bar {
        flex-shrink: 0; display: flex; align-items: center; gap: 10px;
        background: var(--white); border: 1px solid var(--blue-light); border-radius: 999px;
        padding: 6px 10px 6px 14px; box-shadow: 0 8px 22px rgba(28, 96, 239, 0.16);
    }
    .zoom-btn {
        width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--blue-light);
        background: var(--white); color: var(--blue); font-size: 15px; font-weight: 700;
        line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .zoom-btn:hover { background: var(--blue-light); }
    #zoom-slider { width: 90px; accent-color: var(--blue); }
    #zoom-label { font-size: 11.5px; font-weight: 700; color: var(--text-muted); width: 34px; text-align: center; }
    .zoom-fit {
        font-family: var(--font-body); font-weight: 700; font-size: 11.5px; border: 1px solid var(--blue-light);
        background: var(--white); color: var(--blue); border-radius: 999px; padding: 6px 12px;
        cursor: pointer; white-space: nowrap;
    }
    .zoom-fit:hover { background: var(--blue-light); }

    .footer {
        flex-shrink: 0;
        border-top: 1px solid var(--blue-light);
        background: #fbfcff;
        padding: 12px 18px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
    }
    .footer .seq-label { font-size: 12px; font-weight: 700; color: var(--text-muted); flex-shrink: 0; }
    .seq-track { flex: 1; min-width: 160px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .seq-track .chip {
        background: var(--blue-light); color: var(--blue); border-radius: 999px; padding: 3px 10px;
        font-weight: 700; font-size: 12px; font-family: var(--font-title); white-space: nowrap;
    }
    .seq-track .placeholder { color: #a9b3c7; font-weight: 400; font-size: 12.5px; }
</style>
</head>
<body>
<div class="app">
    <div class="topbar">
        <div>
            <h1>강 건너기 — 탐색 순서 클릭 연습</h1>
            <div class="sub">노드를 깊이 우선 탐색 순서대로 클릭해서 목표 상태까지 도달해 보세요.</div>
            <div class="legend">
                <span class="tag tag-init">● 초기 상태</span>
                <span class="tag tag-forbid">● 금지 상태</span>
                <span class="tag tag-goal">● 목표 상태</span>
            </div>
        </div>
        <div class="controls">
            <button class="action" id="btn-retry">다시 하기</button>
        </div>
    </div>

    <div class="status-banner" id="status-banner"></div>

    <div class="canvas-outer" id="canvas-outer">
        <div class="canvas-scaler" id="canvas-scaler">
            <div class="canvas-inner" id="canvas-inner">
                <svg id="svg-layer"></svg>
            </div>
        </div>
    </div>

    <div class="canvas-footer">
        <div class="hint">노드를 순서대로 클릭하세요 (드래그 없이 클릭만 하면 됩니다)</div>
        <div class="zoom-bar">
            <button class="zoom-btn" id="zoom-out" title="축소">&minus;</button>
            <input type="range" id="zoom-slider" min="40" max="150" step="10" value="100">
            <span id="zoom-label">100%</span>
            <button class="zoom-btn" id="zoom-in" title="확대">+</button>
            <button class="zoom-fit" id="zoom-fit">전체 보기</button>
        </div>
    </div>

    <div class="footer">
        <span class="seq-label">클릭한 순서</span>
        <div class="seq-track" id="seq-track"><span class="placeholder">노드를 클릭하면 여기에 표시돼요</span></div>
    </div>
</div>

<script>
(function () {
    var ACTION_LABEL = { farmer: '농부만 건넌다', cabbage: '양배추를 옮긴다', sheep: '양을 옮긴다', wolf: '늑대를 옮긴다' };

    // 실제 강 건너기 규칙 엔진으로 뽑아낸 전체 상태공간 트리
    // (즉시 원상복귀되는 가지만 생략, 두 대칭 정답 모두 포함).
    // [로컬id, 부모 로컬id(0=초기 상태), 행동, 종류]
    var TREE_DATA = [
        [1, 0, 'farmer', 'wolf-sheep'], [2, 0, 'cabbage', 'wolf-sheep'], [3, 0, 'sheep', 'ok'],
        [4, 3, 'farmer', 'ok'], [5, 4, 'cabbage', 'ok'], [6, 5, 'farmer', 'sheep-cabbage'],
        [7, 5, 'sheep', 'ok'], [8, 7, 'farmer', 'wolf-sheep'], [9, 7, 'wolf', 'ok'],
        [10, 9, 'farmer', 'ok'], [11, 10, 'sheep', 'goal'], [12, 9, 'cabbage', 'ok'],
        [13, 12, 'farmer', 'sheep-cabbage'], [14, 12, 'sheep', 'ok'], [15, 14, 'farmer', 'wolf-sheep'],
        [16, 4, 'wolf', 'ok'], [17, 16, 'farmer', 'wolf-sheep'], [18, 16, 'sheep', 'ok'],
        [19, 18, 'farmer', 'sheep-cabbage'], [20, 18, 'cabbage', 'ok'], [21, 20, 'farmer', 'ok'],
        [22, 21, 'sheep', 'goal'], [23, 20, 'wolf', 'ok'], [24, 23, 'farmer', 'wolf-sheep'],
        [25, 23, 'sheep', 'ok'], [26, 25, 'farmer', 'sheep-cabbage'], [27, 0, 'wolf', 'sheep-cabbage']
    ];
    var GOAL_ID = 11; // 우선순위(농부→양배추→양→늑대) 순서로 처음 도달하는 목표 상태

    var FORBID_BADGE = {
        'wolf-sheep': '금지 상태 (양 & 늑대)',
        'sheep-cabbage': '금지 상태 (양 & 양배추)'
    };

    var BOARD_W = 150, BOARD_H = 56;
    var LEVEL_H = 100, SLOT_W = 172;

    var canvasOuter = document.getElementById('canvas-outer');
    var canvasScaler = document.getElementById('canvas-scaler');
    var canvasInner = document.getElementById('canvas-inner');
    var svg = document.getElementById('svg-layer');
    var statusBanner = document.getElementById('status-banner');
    var seqTrack = document.getElementById('seq-track');
    var zoomSlider = document.getElementById('zoom-slider');
    var zoomLabel = document.getElementById('zoom-label');

    var zoom = 1;
    var ZOOM_MIN = 0.4, ZOOM_MAX = 1.5;

    var nodes = {};
    var visitedOrder = [];
    var graded = false;

    function buildTree() {
        nodes = {};
        nodes[0] = { id: 0, parentId: null, action: null, kind: 'init', children: [], x: 0, y: 0 };
        TREE_DATA.forEach(function (entry) {
            var id = entry[0], parent = entry[1], action = entry[2], kind = entry[3];
            nodes[id] = { id: id, parentId: parent, action: action, kind: kind, children: [], x: 0, y: 0 };
            nodes[parent].children.push(id);
        });
    }
    buildTree();

    function computeDfsPathTo(goalId) {
        var path = [];
        var found = false;
        function visit(id) {
            if (found) return;
            path.push(id);
            if (id === goalId) { found = true; return; }
            nodes[id].children.forEach(function (c) { if (!found) visit(c); });
        }
        visit(0);
        return path;
    }

    // ---------- Layout ----------
    function layout() {
        var slot = { n: 0 };
        function assign(id) {
            var node = nodes[id];
            if (node.children.length === 0) { node.x = slot.n * SLOT_W; slot.n++; }
            else {
                node.children.forEach(assign);
                var xs = node.children.map(function (c) { return nodes[c].x; });
                node.x = (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2;
            }
            node.y = node.depth_ * LEVEL_H;
        }
        var depth = { 0: 0 };
        var q = [0];
        while (q.length) {
            var id = q.shift();
            nodes[id].depth_ = depth[id];
            nodes[id].children.forEach(function (c) { depth[c] = depth[id] + 1; q.push(c); });
        }
        assign(0);

        var outerW = canvasOuter.clientWidth / zoom;
        var treeW = Math.max(slot.n * SLOT_W, SLOT_W);
        var innerW = Math.max(outerW, treeW + 140);
        var maxDepth = Math.max.apply(null, Object.keys(nodes).map(function (id) { return nodes[id].depth_; }));
        var innerH = (maxDepth + 1) * LEVEL_H + 50;
        var offset = innerW / 2 - (nodes[0].x + BOARD_W / 2);
        Object.keys(nodes).forEach(function (id) { nodes[id].x += offset; });

        canvasInner.style.width = innerW + 'px';
        canvasInner.style.height = innerH + 'px';
        canvasInner.style.transform = 'scale(' + zoom + ')';
        canvasScaler.style.width = (innerW * zoom) + 'px';
        canvasScaler.style.height = (innerH * zoom) + 'px';
        svg.setAttribute('width', innerW);
        svg.setAttribute('height', innerH);
    }

    function setZoom(z) {
        zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
        zoomSlider.value = Math.round(zoom * 100);
        zoomLabel.textContent = Math.round(zoom * 100) + '%';
        render();
    }
    document.getElementById('zoom-in').addEventListener('click', function () { setZoom(zoom + 0.1); });
    document.getElementById('zoom-out').addEventListener('click', function () { setZoom(zoom - 0.1); });
    zoomSlider.addEventListener('input', function () { setZoom(zoomSlider.value / 100); });
    document.getElementById('zoom-fit').addEventListener('click', function () {
        var savedZoom = zoom;
        zoom = 1;
        layout();
        var neededW = parseFloat(canvasInner.style.width);
        var neededH = parseFloat(canvasInner.style.height);
        zoom = savedZoom;
        setZoom(Math.min(canvasOuter.clientWidth / neededW, canvasOuter.clientHeight / neededH, 1));
        canvasOuter.scrollTop = 0;
        setTimeout(function () {
            canvasOuter.scrollLeft = (canvasScaler.scrollWidth - canvasOuter.clientWidth) / 2;
        }, 0);
    });

    // ---------- Render ----------
    function render() {
        layout();
        canvasInner.querySelectorAll('.rnode').forEach(function (el) { el.remove(); });
        svg.innerHTML = '';

        Object.keys(nodes).forEach(function (idStr) {
            var id = Number(idStr);
            var node = nodes[id];
            if (node.parentId !== null) {
                var parent = nodes[node.parentId];
                var x1 = parent.x + BOARD_W / 2, y1 = parent.y + BOARD_H + 16;
                var x2 = node.x + BOARD_W / 2, y2 = node.y + 16;
                var midY = (y1 + y2) / 2;
                var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', 'M ' + x1 + ' ' + y1 + ' C ' + x1 + ' ' + midY + ', ' + x2 + ' ' + midY + ', ' + x2 + ' ' + y2);
                path.setAttribute('stroke', '#9db8f5');
                path.setAttribute('stroke-width', '2.5');
                path.setAttribute('fill', 'none');
                svg.appendChild(path);
            }
            renderNode(node);
        });
    }

    function renderNode(node) {
        var el = document.createElement('div');
        var visitedIdx = visitedOrder.indexOf(node.id);
        el.className = 'rnode' + (node.kind === 'goal' ? ' goal' : '') + (visitedIdx >= 0 ? ' visited-seq' : '');
        el.style.left = node.x + 'px';
        el.style.top = (node.y + 16) + 'px';
        el.dataset.id = node.id;

        if (node.kind === 'init') {
            var b = document.createElement('div');
            b.className = 'rc-badge tag-init';
            b.style.background = '#e2e8f0'; b.style.color = '#475569';
            b.textContent = '초기 상태';
            el.appendChild(b);
            var hint = document.createElement('div');
            hint.className = 'rc-action muted';
            hint.textContent = '농부, 양, 늑대, 양배추';
            el.appendChild(hint);
        } else {
            if (node.kind === 'goal') {
                var gb = document.createElement('div');
                gb.className = 'rc-badge tag-goal';
                gb.style.background = '#fef3c7'; gb.style.color = '#92700c';
                gb.textContent = '목표 상태';
                el.appendChild(gb);
            } else if (node.kind !== 'ok') {
                var fb = document.createElement('div');
                fb.className = 'rc-badge tag-forbid';
                fb.style.background = '#fee2e2'; fb.style.color = '#b91c1c';
                fb.textContent = FORBID_BADGE[node.kind];
                el.appendChild(fb);
            }
            var actionText = document.createElement('div');
            actionText.className = 'rc-action';
            actionText.textContent = ACTION_LABEL[node.action];
            el.appendChild(actionText);
            if (node.kind === 'goal') {
                var goalText = document.createElement('div');
                goalText.className = 'rc-forbid-text';
                goalText.innerHTML = '🏁 목표 상태<span class="sub">모두 강을 건넜어요!</span>';
                el.appendChild(goalText);
            }
        }

        if (visitedIdx >= 0) {
            var ob = document.createElement('div');
            ob.className = 'order-badge';
            ob.textContent = visitedIdx + 1;
            el.appendChild(ob);
        }

        el.addEventListener('click', function () { onClickNode(node.id); });
        canvasInner.appendChild(el);
    }

    function renderSeq() {
        if (visitedOrder.length === 0) {
            seqTrack.innerHTML = '<span class="placeholder">노드를 클릭하면 여기에 표시돼요</span>';
            return;
        }
        seqTrack.innerHTML = visitedOrder.map(function (id, i) {
            var label = id === 0 ? '초기 상태' : ACTION_LABEL[nodes[id].action];
            return (i > 0 ? '<span class="arrow" style="color:#a9b3c7">→</span>' : '') + '<span class="chip">' + label + '</span>';
        }).join('');
    }

    function onClickNode(id) {
        if (graded) return;
        if (visitedOrder.indexOf(id) >= 0) return;
        visitedOrder.push(id);
        renderSeq();
        render();
        if (id === GOAL_ID) grade();
    }

    function grade() {
        graded = true;
        var correct = computeDfsPathTo(GOAL_ID);
        var isRight = correct.length === visitedOrder.length && correct.every(function (id, i) { return id === visitedOrder[i]; });
        if (isRight) {
            statusBanner.className = 'status-banner show ok';
            statusBanner.textContent = '정답입니다! 깊이 우선 탐색 순서를 정확히 클릭했어요 🎉';
            if (typeof confetti === 'function') confetti({ particleCount: 90, spread: 70, origin: { x: 0.5, y: 0.4 } });
        } else {
            statusBanner.className = 'status-banner show bad';
            statusBanner.textContent = '아쉬워요, 다시 도전해 보세요.';
        }
    }

    document.getElementById('btn-retry').addEventListener('click', function () {
        visitedOrder = [];
        graded = false;
        statusBanner.className = 'status-banner';
        statusBanner.textContent = '';
        renderSeq();
        render();
    });

    window.addEventListener('resize', render);
    if (window.ResizeObserver) {
        new ResizeObserver(function () { render(); }).observe(canvasOuter);
    }

    renderSeq();
    render();
})();
</script>
</body>
</html>
